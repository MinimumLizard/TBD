name: bond_carry
market: lk_bonds
title_key: models.bond_carry.title
summary_key: models.bond_carry.summary
disclaimer_key: model_general
requires_datasets:
  - bonds.trades_current
outputs:
  - models.bond_funding
  - models.bond_carry
versions:
  - method_version: "1.0.0"
    status: reference
    requires_models: { bond_identity: "1.0.0", bond_ns_curve: "1.0.0", bond_execution_gap: "1.0.0" }
    parameters:
      # The old tool's dealer margin over the 12-month bill. A personal assumption, kept for parity; see METHOD.md.
      funding_spread_bp: 5.0
    parity:
      reference: "MinimumLizard/Nelson-Siegel@1c33084 signals/carry.py profile() and funding_rate(), run on the old database for every curve day with the execution gap as entry shift"
      tolerance: 1.0e-9
  - method_version: "1.1.0"
    status: current
    changes: Same method on the version 2 curve (decision 0014); bonds quoted wider than 50 bp (administered) are left out; adds each bond's convexity (2026-10-18), for the bond page's yield-change table.
    requires_models: { bond_identity: "2.0.0", bond_ns_curve: "2.0.0", bond_execution_gap: "1.1.0" }
    parameters:
      funding_spread_bp: 5.0
      max_quote_spread_bp: 50.0
      with_convexity: true
