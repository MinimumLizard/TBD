# CSE disclosures, every two hours from 08:17 to 22:17 Sri Lanka time on weekdays.
name: "Collect: CSE announcements"

on:
  schedule:
    - cron: "47 2-16/2 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-cse-announcements
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/_run.yml
    with:
      command: data_platform.jobs.collect cse_api:announcements
      timeout: 20
    secrets: inherit
