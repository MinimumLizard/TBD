# Weekly, Monday 07:52 Sri Lanka time: the Central Bank's interest-rate tables (4.04 monthly, 4.03 annual) and its
# weekly treasury bill auction file. Table 4.04 is updated around the 10th of each month; a run that finds no new
# file is a quiet success.
name: "Collect: CBSL interest rates"

on:
  schedule:
    - cron: "22 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-cbsl
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/_run.yml
    with:
      command: data_platform.jobs.collect cbsl
      timeout: 20
    secrets: inherit
