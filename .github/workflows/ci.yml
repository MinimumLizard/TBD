# Runs on every push and pull request. Nothing merges unless this is green (CLAUDE.md conventions).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust      # throwaway CI database: no password, so none appears in this file
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Tests (collectors, database guard rails, gap check, backups, repo rules)
        run: uv run pytest -m "not legacy"
      - name: Model registry (every manifest valid; the web app's copy of it up to date)
        run: |
          uv run python -m data_platform.models.registry check
          uv run python -m data_platform.models.registry export-web --check-only
      - name: Copy lint (banned advice language in user-facing text)
        run: uv run python -m data_platform.compliance
      - name: Source register (no prohibited source enabled)
        run: uv run python -c "from data_platform.core import sources; print(len(sources.load()), 'sources valid; launch blockers (need written permission):', sources.launch_blockers())"

  web:
    # The website: type check, unit tests, production build, and the tier-leak suite against a seeded database,
    # with the server reading as the restricted web_reader role.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests (tier check, query builder, freshness, structure)
        run: npm test
      - name: Production build
        run: npm run build
      - name: Seed the tier-leak database
        run: echo "LEAK_URL=$(uv run python tests/leak/seed.py | tail -1)" >> "$GITHUB_ENV"
      - name: Tier-leak suite (every page and API route, as every tier)
        run: |
          DATABASE_URL="$LEAK_URL" ALLOW_TEST_TIERS=1 npx next start -p 3100 > next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3100/api/v1/models > /dev/null && break; sleep 1; done
          npm run test:leak || { cat next.log; exit 1; }
