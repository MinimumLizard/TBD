# Nightly 03:13 Sri Lanka time: pg_dump of the database to both stores, write-once (decision 0004).
name: "Backup: database export"

on:
  schedule:
    - cron: "43 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-export
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/_run.yml
    with:
      command: data_platform.jobs.backup export
      timeout: 30
      pg_client: true     # pg_dump refuses to dump a server newer than itself; Supabase runs a recent Postgres
    secrets: inherit
