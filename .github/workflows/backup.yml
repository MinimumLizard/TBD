# Nightly 02:43 Sri Lanka time: copies every new raw object to the second store (Backblaze B2).
name: "Backup: copy archive to B2"

on:
  schedule:
    - cron: "13 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/_run.yml
    with:
      command: data_platform.jobs.backup replicate
      timeout: 60
    secrets: inherit
