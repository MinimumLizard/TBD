# Colombo Stock Exchange trading calendar: weekdays are sessions unless listed below.
#
# Source (2026-10-18): the Central Bank's bank holiday lists for 2026 and 2027
# (https://www.cbsl.gov.lk/en/about/about-the-bank/bank-holidays-2026 and ...-2027), which are made under the
# Holidays Act; the CSE does not trade on bank holidays. Every closure up to the latest session was also seen in the
# data (no ASPI value that day), so those are confirmed. Future dates are listed in advance and marked unconfirmed
# until checked against the CSE's own holiday circular. Two closures are not bank holidays and stay unexplained.
# A weekday that is not listed is a session: if it has no data, the gap check reports it.
