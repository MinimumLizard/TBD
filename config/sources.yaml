# The source register (decision 0009). Every data source the platform may touch is listed here with the
# evidence for whether its terms allow commercial use. A source whose status is `prohibited` cannot be enabled.
# Re-check each source's terms at least every six months and update `checked` (the gap check reminds you).
#
#   status: allowed     the terms permit commercial use (attribution as stated)
#           silent      no published terms found; used under the owner's rule, with the risk noted
#           prohibited  the terms forbid commercial use or redistribution; never run

pdmo:
  name: Public Debt Management Office (Ministry of Finance, Sri Lanka), treasury.gov.lk
  homepage: https://www.treasury.gov.lk/
  enabled: true
  rights:
    status: silent
    evidence: >-
      No terms of use, copyright notice or data licence found on treasury.gov.lk (searched 2026-10-11;
      /web/terms-and-conditions returns 404). Government publication. Enquiry recommended (docs/audit.md §7).
    url: https://www.treasury.gov.lk/
    checked: 2026-10-11
    attribution: "Source: Public Debt Management Office, Ministry of Finance, Sri Lanka"
  datasets: [bonds.quotes, bonds.volumes, bonds.trades, bonds.auction_results, bonds.auction_announcements]
  calendar: lk_bond_market
  notes: >-
    Sucuri firewall: a challenge page is treated as a failure, never as content. Index pages exist per year;
    years are derived from the date (the old pipeline's hard-coded years were audit finding F1).

cse_api:
  name: Colombo Stock Exchange public website API (www.cse.lk/api, cdn.cse.lk)
  homepage: https://www.cse.lk/
  enabled: true
  rights:
    status: permission_required
    evidence: >-
      The CSE's terms are at https://www.cse.lk/disclaimer (the Colombo Stock Exchange, World Trade Center,
      Colombo 01; the footer's "Terms & Conditions"; the 2026-10-11 search looked for /terms-of-use, which does not
      exist). Two sections apply. "Using the Contents": you may only view and print one copy "of your own personal,
      noncommercial use", and may not copy, store, publish, reproduce, create a derivative work from, display or
      distribute any of the Contents "whether for direct or indirect commercial or monetary gain or otherwise
      without the prior written permission of CSE. Requests for such permission ... should be sent to the Chief
      Executive Officer of the CSE." "Market Data Subscription": "Access to and use of the Data and Information in
      the Website is for personal and non-commercial use. No part of the Data or information ... may be copied,
      reproduced, republished, downloaded, posted, broadcasted, transmitted, adapted, disseminated, exploited or
      modified in any way, including but not limited to, through the use of any artificial intelligence systems
      ... for any commercial purpose and/or for profit". The page also says "CSE prohibits caching". Re-read in a
      browser on 2026-10-18 13:15 UTC (the page is drawn by JavaScript; text saved, sha256 5b390a8f...).
      So the product cannot launch on this source without the CSE's written permission or a market-data licence
      (the CSE also licenses data through vendors such as ICE). Development and the owners' private preview only.
    url: https://www.cse.lk/disclaimer
    checked: 2026-10-18
    attribution: "Source: Colombo Stock Exchange"
  datasets: [cse.security_list, cse.prices_daily, cse.indices_daily, cse.market_daily, cse.announcements,
             cse.company_info_daily, cse.company_profiles, cse.company_announcements, cse.announcement_details]
  calendar: cse

cbsl:
  name: Central Bank of Sri Lanka statistical tables (interest rates incl. AWFDR, treasury bill yields)
  homepage: https://www.cbsl.gov.lk/
  enabled: true
  rights:
    status: silent
    evidence: >-
      No terms of use, disclaimer or copyright page (all return 404); only a privacy statement and the footer
      "© Central Bank of Sri Lanka ... All Rights Reserved". No rights note in the xlsx files. Silent under
      decision 0009, with that notice: a written enquiry to cbslgen@cbsl.lk is advisable before paid use.
    url: https://www.cbsl.gov.lk/en/statistics/statistical-tables/monetary-sector
    checked: 2026-10-18
    attribution: "Source: Central Bank of Sri Lanka"
  datasets: [rates.cbsl_monthly, rates.cbsl_annual, rates.tbill_auctions]
  notes: >-
    Table 4.04 (monthly rates, 2003 to date), 4.03 (annual, 1990 to date) and the weekly treasury bill auction file
    (1996 to November 2025; not updated since 24 December 2025), for the fixed deposit and treasury bill comparison
    (lk_savings_compare). File names carry the update date, so links are read from the statistical-tables pages.

dcs_cpi:
  name: Department of Census and Statistics, consumer price indices (CCPI)
  homepage: https://www.statistics.gov.lk/
  enabled: true
  rights:
    status: silent
    evidence: >-
      Footer "All Rights Reserved"; the only policy (microdata dissemination) does not cover published tables.
      PDF only; several base years to splice. Enquiry: information@statistics.gov.lk.
    url: https://www.statistics.gov.lk/InflationAndPrices/StaticalInformation/MonthlyCCPI
    checked: 2026-10-18
    attribution: "Source: Department of Census and Statistics, Sri Lanka"
  datasets: [rates.cpi_monthly]
  notes: >-
    "Movements of the CCPI" PDFs for bases 2021, 2013, 2006/07 and 2002 (2003 to date). The NCPI is not collected.

