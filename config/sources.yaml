# --- Researched 2026-10-18 for crypto analytics and the FD comparison (docs/research/data-sources-2026-10-18.md) ---

bitstamp:
  name: Bitstamp exchange market data (OHLC from 2011-09-14)
  homepage: https://www.bitstamp.net/
  enabled: true        # development and the owners' private preview only; a launch blocker until the agreement is signed
  rights:
    status: permission_required
    evidence: >-
      API documentation: "Companies seeking to utilize Bitstamp's exchange data for their own commercial purposes
      are directed to contact partners@bitstamp.net to receive and sign a commercial use Data License Agreement",
      which allows "the incorporation and redistribution of our exchange data for commercial purposes ... the
      right to create ratios, calculations, new original works, statistics". Fee not published.
    url: https://www.bitstamp.net/api/
    checked: 2026-10-18
    attribution: "Source: Bitstamp"
  datasets: [crypto.ohlc_daily]
  notes: >-
    The price source for the crypto section (decision 0019): daily candles for BTC, ETH and other majors in USD,
    and ETH in BTC, from data_platform/collectors/bitstamp. Enabled on 2026-10-18 for development; the commercial
    Data License Agreement (partners@bitstamp.net, draft in docs/letters/data-permission-requests.md) must be signed
    before the section is public, and the status then becomes `allowed`.

kraken:
  name: Kraken public market data and OHLCVT downloads
  homepage: https://www.kraken.com/
  enabled: false
  rights:
    status: prohibited
    evidence: >-
      Global Terms (updated 2026-10-06) §9: you will not "distribute or otherwise commercially exploit or make
      available to any third party Our Content in any way" without permission. Ask in writing before any use.
    url: https://www.kraken.com/legal/global-terms
    checked: 2026-10-18
  datasets: []

coinmarketcap_startup:
  name: CoinMarketCap API, Startup plan (paid)
  homepage: https://coinmarketcap.com/api/
  enabled: false
  rights:
    status: allowed
    evidence: >-
      Pricing FAQ: paid plans "include commercial use rights", licence for one product with up to 100k users, not
      to be redistributed as a standalone service. Startup (USD 79/month) includes all-time history. The website
      terms say "personal, non-commercial use unless you enter into a separate agreement": confirm in writing.
    url: https://coinmarketcap.com/api/pricing/
    checked: 2026-10-18
    attribution: "Data provided by CoinMarketCap.com"
  datasets: []
  notes: For market caps and dominance, if subscribed.

alternative_me_fng:
  name: alternative.me Crypto Fear & Greed Index
  homepage: https://alternative.me/crypto/fear-and-greed-index/
  enabled: false
  rights:
    status: allowed
    evidence: '"Commercial use is allowed as long as the attribution is given right next to the display of the data."'
    url: https://alternative.me/crypto/fear-and-greed-index/
    checked: 2026-10-18
    attribution: "Source: alternative.me Crypto Fear & Greed Index"
  datasets: []
