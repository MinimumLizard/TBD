# Who sees what (docs/architecture.md §8, decision 0015).
#
# PROPOSAL FOR THE OWNER TO EDIT. Which feature sits in which tier is a business decision; this file is the only
# place it is made. The web app's single tier check (web/lib/entitlements.ts) reads a copy generated from this file
# (python -m data_platform.models.registry export-web), and CI fails if the copy is out of date.
#
# Tiers are ordered: a model is visible to its minimum tier and every tier above it.
#
#   free_preview: { delay_days: N }   tiers below the minimum see the same outputs, but only for dates at least
#                                     N days old. Enforced on the server, like every tier rule.
#   recent_window: { days: N, full_history_tier: T }
#                                     tiers from the minimum up to (not including) T see only the last N days of the
#                                     model's outputs; T and above see the whole history. Enforced on the server.

tiers: [free, plus, pro, professional]

models:
  # LKR government bonds
  bond_identity:        { minimum_tier: free }    # bond list, each day's dealer quotes
  bond_ns_curve:        { minimum_tier: free, recent_window: { days: 30, full_history_tier: plus } }
                        # the fitted yield curve and each bond's distance from it: free sees the last 30 days,
                        # Plus and above the whole history (a bond's own analysis is tiered; owner, 2026-10-18)
  bond_liquidity:       { minimum_tier: free }    # turnover, days traded, auction cycle, liquidity tier
  bond_rv_zscores:      { minimum_tier: plus, free_preview: { delay_days: 5 } }   # residuals vs own history
  bond_execution_gap:   { minimum_tier: plus }    # where trades print against the quote screen
  bond_carry:           { minimum_tier: pro }     # carry, rolldown, duration
  # Colombo Stock Exchange
  cse_market_tape:      { minimum_tier: free }    # indices, turnover, breadth, foreign flows
  cse_security_metrics: { minimum_tier: free }    # per-share price, range, volume and relative-return metrics
  cse_corporate_actions: { minimum_tier: free }   # dividends, splits, scrip and rights issues: facts the CSE
                                                  # published, read from its own announcement records
  cse_total_returns:    { minimum_tier: free }    # each share's return with those actions included (the same
                                                  # published facts, combined by a stated formula)
  cse_ownership:        { minimum_tier: free }    # who owns each company, by owner type, its ownership group and a
                                                  # free-float estimate: company-level facts from the companies'
                                                  # own filings (no individual is ever named; see below)
  cse_fundamentals:     { minimum_tier: free }    # EPS, net assets per share, P/E, P/B, ROE, dividend yield: figures
                                                  # the companies published, checked inside each report
  # Savings education
  lk_savings_compare:   { minimum_tier: free }    # fixed deposits vs treasury bills vs inflation (education: free)

# Computed and stored, but served to nobody until the owner decides otherwise. The pair-spread reversion
# statistics measure how far spreads moved back after large z-scores; shown next to a pair they would read as a
# performance claim (audit §8), so they need a legal view first.
# The two ownership tables below name private individuals (the top-20 shareholder lists, and the controllers and
# chains built from them). Sri Lanka's Personal Data Protection Act (decision 0010) applies: they stay unpublished
# until the owner's lawyer has reviewed them (docs/plan-retail-features.md §7). Migration 0013 also withholds the
# website's database grant on them, so the website could not read them even by mistake.
unpublished_outputs:
  - models.model_stats
  - models.cse_holding
  - models.cse_ownership_detail
